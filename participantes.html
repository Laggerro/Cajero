<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Empresas de MARKETING - eBANK</title>
<script src="assets/js/cajero-config.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
body { background-color: #0b132b; color: #ffffff; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
.atm-container {
    width: min(var(--atm-width), calc(100vw - 24px));
    height: min(var(--atm-height), calc(100vh - 24px));
    background: linear-gradient(135deg, #0f1c3f 0%, #1c2d5a 100%);
    border: 10px solid #1c2d5a; border-radius: 18px;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 20px;
    box-shadow: 0 0 40px rgba(0, 102, 255, 0.3); position: relative;
}
/* Encabezado */
.header { display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid #e63946; padding: 8px 15px; background: rgba(10, 20, 45, 0.6); border-radius: 8px; }
.header-left { display: flex; align-items: center; gap: 15px; }
.school-logo { height: 45px; width: auto; object-fit: contain; }
.brand-title { font-size: 26px; font-weight: 800; color: #ffffff; }
.brand-title span { color: #e63946; }
.subtitle { padding-right: 15px; font-size: 16px; color: #a0aec0; text-transform: uppercase; font-weight: 600; }

/* Zona Central Grilla */
.menu-grid { width: 100%; display: flex; justify-content: center; align-items: center; flex-grow: 1; padding: 5px 0; }
.menu-column { position: absolute; top: var(--button-start-y); left: 20px; width: 22%; display: grid; grid-template-rows: repeat(4, var(--button-row-height)); align-content: start; gap: var(--button-gap); }
.right-col { left: auto; right: 20px; }
.menu-column .btn-action-w, .menu-column .btn-action-r { grid-row: 4; }
.left-col { text-align: left; }
.right-col { text-align: right; }
.btn-label { font-size: 15px; font-weight: 700; background: rgba(255, 255, 255, 0.08); color: #ffffff; padding: 12px 14px; border-left: 5px solid #00b4d8; border-radius: 6px; }
.right-col .btn-label { border-left: none; border-right: 5px solid #00b4d8; text-align: right; }
.btn-action-w { border-left-color: #2ec4b6 !important; background: rgba(46, 196, 182, 0.15); }
.btn-action-r { border-right-color: #e63946 !important; background: rgba(230, 57, 70, 0.15); }

/* Zona Central Agrandada */
.content-center { width: 56%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.photo-caption-top { font-size: 20px; color: #00f0ff; font-weight: 800; margin-bottom: 8px; min-height: 30px; text-shadow: 0 0 10px rgba(0, 240, 255, 0.5); }

/* CARRUSEL 3D VISTOSO Y GRANDE */
.carousel-3d-wrapper {
    width: min(var(--process-carousel-width), 100%);
    height: var(--process-carousel-height);
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    perspective: 800px;
    overflow: hidden;
}
.carousel-card {
    position: absolute;
    width: 75%;
    height: 88%;
    border-radius: 12px;
    overflow: hidden;
    transition: all 0.6s cubic-bezier(0.25, 1, 0.5, 1);
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.7);
    background: #060d1f;
}
.carousel-card img {
    width: 100%;
    height: 100%;
    object-fit: contain;
}
/* Posiciones Tridimensionales del Carrusel */
.card-center {
    transform: translateX(0) scale(1.15) translateZ(0);
    z-index: 5;
    border: 3px solid #00b4d8;
    box-shadow: 0 0 25px rgba(0, 180, 216, 0.5);
    opacity: 1;
}
.card-left {
    transform: translateX(-40%) scale(0.8) rotateY(25deg);
    z-index: 2;
    opacity: 0.45;
    border: 1px solid #1c2d5a;
    filter: blur(1px);
}
.card-right {
    transform: translateX(40%) scale(0.8) rotateY(-25deg);
    z-index: 2;
    opacity: 0.45;
    border: 1px solid #1c2d5a;
    filter: blur(1px);
}
.card-hidden {
    transform: scale(0.5);
    opacity: 0;
    z-index: 0;
}
/* Indicador de Puntos Abajo */
.dots-container { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; justify-content: center; max-width: 90%; }
.dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.2);
    transition: all 0.3s ease;
}
.dot.active {
    background: #00f0ff;
    box-shadow: 0 0 8px #00f0ff;
    width: 18px;
    border-radius: 5px;
}
.pause-indicator { font-size: 12px; color: #e63946; margin-top: 4px; min-height: 18px; font-weight: bold; }
.footer { text-align: center; border-top: 1px solid rgba(255, 255, 255, 0.1); padding-top: 8px; font-size: 13px; color: #94a3b8; }
.badge { color: #fff; border-radius: 4px; font-size: 18px; font-weight: bold; }
</style>
</head>
<body>
<div class="atm-container">
    <div class="header">
        <div class="header-left">
            <img src="assets/images/logo.png" alt="Logo Colegio" class="school-logo" onerror="this.style.display='none'">
            <div>
                <div class="brand-title">e<span>BANK</span></div>
                <div class="subtitle">Empresas de MARKETING</div>
            </div>
        </div>
        <div style="text-align: right;">
            <span class="badge">Departamento Economía</span>
            <div class="subtitle" style="margin-top: 4px; color: #00b4d8;">EXPO Técno Contable</div>
        </div>
    </div>
    
    <div class="menu-grid">
        <div class="menu-column left-col">
            <div class="btn-label btn-action-w">&lt; SALIR / MENÚ</div>
        </div>
        
        <!-- Zona Central Agrandada con Carrusel 3D -->
        <div class="content-center">
            <div id="photo-caption-top" class="photo-caption-top">Cargando...</div>
            <div class="carousel-3d-wrapper" id="carousel-wrapper">
                <!-- Las tarjetas se generan dinámicamente con JS -->
            </div>
            <div id="dots-container" class="dots-container"></div>
            <div id="pause-indicator" class="pause-indicator"></div>
        </div>
        
        <div class="menu-column right-col">
            <div class="btn-label btn-action-r">SIGUIENTE &gt;</div>
        </div>
    </div>
    
    <div class="footer">
        <span>Avanzar Foto (Pausa el tiempo configurado en foto actual) | Volver al Menú del Cajero</span>
    </div>
</div>

<script>
// Arreglo configurado con las 17 imágenes desde foto1.jpg hasta foto17.jpg
const fotosConstruccion = [
    { src: "assets/images/participantes/foto1.jpg", titulo: "Empresa VALLAC" },
    { src: "assets/images/participantes/foto2.jpg", titulo: "Empresa Anuncio Alto" },
    { src: "assets/images/participantes/foto3.jpg", titulo: "Empresa Elite Agency S.A." },
    { src: "assets/images/participantes/foto4.jpg", titulo: "Empresa acme" },
    { src: "assets/images/participantes/foto5.jpg", titulo: "Empresa Bloom" },
    { src: "assets/images/participantes/foto6.jpg", titulo: "Empresa ClickBait" },
    { src: "assets/images/participantes/foto7.jpg", titulo: "Empresa FULL BOX" },
    { src: "assets/images/participantes/foto8.jpg", titulo: "Empresa NOVA studio" },
    { src: "assets/images/participantes/foto9.jpg", titulo: "Empresa OLMO Corp" },
    { src: "assets/images/participantes/foto10.jpg", titulo: "Empresa Pack Nova" },
    { src: "assets/images/participantes/foto11.jpg", titulo: "Empresa Velvet" },
    { src: "assets/images/participantes/foto12.jpg", titulo: "Empresa NÉXORA" },
    { src: "assets/images/participantes/foto13.jpg", titulo: "Empresa TINNMARK" },
    { src: "assets/images/participantes/foto14.jpg", titulo: "Empresa IMPACT 360" },
    { src: "assets/images/participantes/foto15.jpg", titulo: "Empresa FRIMM" },
    { src: "assets/images/participantes/foto16.jpg", titulo: "Empresa Brand Solutions" },
    { src: "assets/images/participantes/foto17.jpg", titulo: "Empresa NOVA IMPACT" }
];

let currentIndex = 0;
let autoSlideTimer = null;
let pauseTimer = null;
let inactivityTimer = null;

function resetInactivityTimer() {
    clearTimeout(inactivityTimer);
    inactivityTimer = setTimeout(() => { 
        window.location.href = "index.html"; // Vuelve al menú principal manteniendo la sesión
    }, getCajeroConfig().carouselInactivitySeconds * 1000);
}
function initCarousel() {
    const wrapper = document.getElementById('carousel-wrapper');
    const dotsContainer = document.getElementById('dots-container');
    wrapper.innerHTML = '';
    dotsContainer.innerHTML = '';
    
    fotosConstruccion.forEach((foto, index) => {
        // Crear tarjeta de imagen
        const card = document.createElement('div');
        card.className = 'carousel-card card-hidden';
        card.id = `card-${index}`;
        
        const img = document.createElement('img');
        img.src = foto.src;
        img.alt = foto.titulo;
        img.onerror = function() { this.src = 'assets/images/logo.png'; };
        
        card.appendChild(img);
        wrapper.appendChild(card);
        
        // Crear indicador de punto
        const dot = document.createElement('div');
        dot.className = `dot ${index === 0 ? 'active' : ''}`;
        dot.id = `dot-${index}`;
        dotsContainer.appendChild(dot);
    });
    updateCarouselView();
}

function updateCarouselView() {
    const total = fotosConstruccion.length;
    fotosConstruccion.forEach((_, index) => {
        const card = document.getElementById(`card-${index}`);
        const dot = document.getElementById(`dot-${index}`);
        
        card.className = 'carousel-card';
        if (dot) dot.className = 'dot';
        
        if (index === currentIndex) {
            card.classList.add('card-center');
            if (dot) dot.classList.add('active');
        } else if (index === (currentIndex - 1 + total) % total) {
            card.classList.add('card-left');
        } else if (index === (currentIndex + 1) % total) {
            card.classList.add('card-right');
        } else {
            card.classList.add('card-hidden');
        }
    });
    document.getElementById('photo-caption-top').innerText = fotosConstruccion[currentIndex].titulo;
}

function startAutoSlide() {
    clearInterval(autoSlideTimer);
    document.getElementById('pause-indicator').innerText = "";
    autoSlideTimer = setInterval(() => {
        currentIndex = (currentIndex + 1) % fotosConstruccion.length;
        updateCarouselView();
    }, getCajeroConfig().processCarouselIntervalSeconds * 1000);
}

function pauseCurrentPhoto() {
    clearInterval(autoSlideTimer);
    clearTimeout(pauseTimer);
    currentIndex = (currentIndex + 1) % fotosConstruccion.length;
    updateCarouselView();
    const pauseSeconds = getCajeroConfig().carouselPauseSeconds;
    document.getElementById('pause-indicator').innerText = `Pausado por ${pauseSeconds} segundos`;
    
    pauseTimer = setTimeout(() => {
        startAutoSlide();
    }, pauseSeconds * 1000);
}

document.addEventListener('keydown', (e) => {
    resetInactivityTimer();
    const key = e.key.toUpperCase();
    if (key === 'R') {
        pauseCurrentPhoto();
    }
    if (key === 'W') {
        window.location.href = "index.html";
    }
});

// Inicializar
initCarousel();
startAutoSlide();
resetInactivityTimer();
</script>
</body>
</html>
