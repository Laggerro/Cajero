<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Participantes - eBANK</title>
  <script src="assets/js/cajero-config.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0b132b; color: #ffffff; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }

    .atm-container {
     width: min(var(--atm-width), calc(100vw - 24px));
     height: min(var(--atm-height), calc(100vh - 24px));
      background: linear-gradient(135deg, #0f1c3f 0%, #1c2d5a 100%);
      border: 10px solid #1c2d5a; border-radius: 18px;
      display: flex; flex-direction: column; justify-content: space-between; padding: 20px;
      box-shadow: 0 0 40px rgba(0, 102, 255, 0.3); position: relative;
    }

    .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid #e63946; padding: 8px 15px; background: rgba(10, 20, 45, 0.6); border-radius: 8px; }
    .header-left { display: flex; align-items: center; gap: 15px; }
    .school-logo { height: 45px; width: auto; object-fit: contain; }
    .brand-title { font-size: 26px; font-weight: 800; color: #ffffff; }
    .brand-title span { color: #e63946; }
    .subtitle { padding-right: 15px;; font-size: 16px; color: #a0aec0; text-transform: uppercase; font-weight: 600; }

    .menu-grid { width: 100%; display: flex; justify-content: center; align-items: stretch; flex-grow: 1; padding: 10px 0; }
    .menu-column { position: absolute; top: var(--button-start-y); left: 20px; width: 28%; display: grid; grid-template-rows: repeat(4, var(--button-row-height)); align-content: start; gap: var(--button-gap); }
    .right-col { left: auto; right: 20px; }
    .menu-column .btn-action-w, .menu-column .btn-action-r { grid-row: 4; }
    .left-col { text-align: left; }
    .right-col { text-align: right; }

    .btn-label { font-size: var(--button-font-size) !important; font-weight: 700; background: rgba(255, 255, 255, 0.08); color: #ffffff; height: var(--button-row-height); display: flex; align-items: center; padding: 0 16px; border-left: 5px solid #00b4d8; border-radius: 6px; margin: 0; }
    .right-col .btn-label { border-left: none; border-right: 5px solid #00b4d8; }
    .btn-action-w { border-left-color: #2ec4b6 !important; background: rgba(46, 196, 182, 0.15); }
    .btn-action-r { border-right-color: #e63946 !important; background: rgba(230, 57, 70, 0.15); }

    .content-center { width: 44%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
    .photo-caption, .pause-indicator { font-size: var(--content-text-font-size) !important; }
    
    /* Contenedor del Carrusel de Fotos */
    .carousel-box {
      width: min(var(--participants-carousel-width), 100%); height: var(--participants-carousel-height);
      background: #060d1f; border: 3px solid #00b4d8;
      border-radius: 12px; overflow: hidden; position: relative;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
    }

    .carousel-img { width: 100%; height: 100%; object-fit: contain; transition: opacity 0.5s ease-in-out; }

    .photo-caption { margin-top: 8px; font-size: 14px; color: #00f0ff; font-weight: bold; }
    .pause-indicator { font-size: 11px; color: #e63946; margin-top: 4px; min-height: 16px; font-weight: bold; }

    .footer { text-align: center; border-top: 1px solid rgba(255, 255, 255, 0.1); padding-top: 8px; font-size: 13px; color: #94a3b8; }
   .badge { color: #fff; padding: 0px 0px; border-radius: 4px; font-size: 18px; font-weight: bold; }
  </style>
</head>
<body>

<div class="atm-container">
  <div class="header">
    <div class="header-left">
      <img src="assets/images/logo.png" alt="Logo Colegio" class="school-logo" onerror="this.style.display='none'">
      <div>
        <div class="brand-title">e<span>BANK</span></div>
        <div class="subtitle">Participantes</div>
      </div>
    </div>
    <div style="text-align: right;">
      <span class="badge">Departamento Economía</span>
      <div class="subtitle" style="margin-top: 4px; color: #00b4d8;">EXPO Técno Contable</div>
    </div>
  </div>

  <div class="menu-grid">
    <div class="menu-column left-col">
      <div class="btn-label btn-action-w">&lt; SALIR / MENÚ [W]</div>
    </div>

    <!-- Zona Central: Carrusel de fotos de assets/images/construccion/ -->
    <div class="content-center">
      <div class="carousel-box">
        <img id="carousel-img" class="carousel-img" src="assets/images/construccion/foto1.jpg" alt="Foto Proceso" onerror="this.src='assets/images/logo.png'">
      </div>
      <div id="photo-caption" class="photo-caption">Alumnos de 1er Año A y B</div>
      <div id="pause-indicator" class="pause-indicator"></div>
    </div>

    <div class="menu-column right-col">
      <div class="btn-label btn-action-r">SIGUIENTE [R] &gt;</div>
    </div>
  </div>

  <div class="footer">
    <span>[R] Avanzar Foto (pausa configurable) | [W] Volver al Menú del Cajero</span>
  </div>
</div>

<script>
  // Fotos del proyecto guardadas en assets/images/participantes/.
const fotosParticipantes = [
  { src: "assets/images/participantes/foto1.jpg", titulo: "Alumnos de 1er Año A y B" },
  { src: "assets/images/participantes/foto2.jpg", titulo: "Alumnos de 2do Año A y B" },
  { src: "assets/images/participantes/foto3.jpg", titulo: "Equipo de Profesores de Economía y Tecnología" }
];

  let currentIndex = 0;
  let autoSlideTimer = null;
  let pauseTimer = null;
  let inactivityTimer = null;

  function resetInactivityTimer() {
    clearTimeout(inactivityTimer);
    inactivityTimer = setTimeout(() => { window.location.href = "index.html"; }, getCajeroConfig().carouselInactivitySeconds * 1000);
  }

  function showPhoto(index) {
    currentIndex = index;
    const imgEl = document.getElementById('carousel-img');
    const captionEl = document.getElementById('photo-caption');

    imgEl.style.opacity = 0.2;
    setTimeout(() => {
      imgEl.src = fotosParticipantes[currentIndex].src;
      captionEl.innerText = fotosParticipantes[currentIndex].titulo;
      imgEl.style.opacity = 1;
    }, 150);
  }

  function startAutoSlide() {
    clearInterval(autoSlideTimer);
    document.getElementById('pause-indicator').innerText = "";
    autoSlideTimer = setInterval(() => {
      currentIndex = (currentIndex + 1) % fotosParticipantes.length;
      showPhoto(currentIndex);
    }, getCajeroConfig().participantsCarouselIntervalSeconds * 1000);
  }

  function pauseAndNext() {
    clearInterval(autoSlideTimer);
    clearTimeout(pauseTimer);

    // Avanza a la siguiente foto
    currentIndex = (currentIndex + 1) % fotosParticipantes.length;
    showPhoto(currentIndex);

    const pauseSeconds = getCajeroConfig().carouselPauseSeconds;
    document.getElementById('pause-indicator').innerText = `⏸️ Pausado por ${pauseSeconds} segundos`;

    // Reanuda el carrusel automático al terminar la pausa configurada
    pauseTimer = setTimeout(() => {
      startAutoSlide();
    }, pauseSeconds * 1000);
  }

  document.addEventListener('keydown', (e) => {
    resetInactivityTimer();
    const key = e.key.toUpperCase();

    if (key === 'R') { // Presionar R salta a la siguiente foto y pausa 10s
      pauseAndNext();
    }

    if (key === 'W') { // Presionar W vuelve al menú
      window.location.href = "index.html";
    }
  });

  // Inicio
  showPhoto(0);
  startAutoSlide();
  resetInactivityTimer();
</script>
</body>
</html>
